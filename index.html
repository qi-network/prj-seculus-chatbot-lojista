<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot Seculus</title>

  <!-- Tema e script do df-messenger -->
  <link rel="stylesheet"
        href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css" />
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; padding: 24px; }
    df-messenger { z-index: 9999; --df-messenger-primary-color: #25d366; }
    .container { max-width: 980px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Atendimento de Produtos – Seculus</h2>

    <df-messenger
      location="us-central1"
      project-id="mkt-produtos"
      agent-id="5c38d6fc-f3a3-4582-8e60-790f5d75c4e2"
      language-code="pt-br"
      max-query-length="-1">
      <df-messenger-chat chat-title="Atendimento de Produtos Lojista"></df-messenger-chat>
    </df-messenger>
  </div>

  <!-- Abre o WhatsApp automaticamente quando o agente mandar um link wa.me -->
  <script>
    window.addEventListener('dfMessengerLoaded', function () {
      const df = document.querySelector('df-messenger');

      df.addEventListener('df-response-received', function (e) {
        try {
          const msgs = e.detail.response?.queryResult?.fulfillmentMessages || [];
          for (const msg of msgs) {
            // Mensagens de texto simples
            if (msg.text?.text?.[0] && msg.text.text[0].includes("wa.me")) {
              const match = msg.text.text[0].match(/https:\/\/wa\.me\/\d+[^\s]*/);
              if (match) {
                window.open(match[0], "_blank");
                return;
              }
            }
            // Rich content com botão
            if (msg.payload?.richContent) {
              const items = msg.payload.richContent.flat();
              for (const it of items) {
                if (it.type === "button" && typeof it.link === "string" && it.link.includes("wa.me")) {
                  window.open(it.link, "_blank");
                  return;
                }
              }
            }
          }
        } catch (err) {
          console.warn("Falha ao processar resposta para abrir WhatsApp:", err);
        }
      });
    });
  </script>

  <!-- Fallback: também mostre um botão clicável (caso popup seja bloqueado) -->
  <!-- No seu Playbook, mantenha o payload do botão "💬 Falar com o suporte via WhatsApp" -->
</body>
</html>
