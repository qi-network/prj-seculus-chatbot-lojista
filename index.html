<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendimento de Produtos – Seculus</title>

  <!-- Estilos do Dialogflow Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Google Sans", Arial, sans-serif;
      background-color: #fff;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #444;
    }

    /* Estilo do componente do chat */
    df-messenger {
      z-index: 999;
      position: fixed;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans, Arial, sans-serif;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-message-user-background: #d3e3fd;
      --df-messenger-message-bot-background: #fff;
      bottom: 0;
      right: 0;
      top: 0;
      width: 380px;
      border-left: 1px solid #ccc;
    }

    /* Botão do WhatsApp */
    .whatsapp-button {
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 16px;
      font-family: "Google Sans", Arial, sans-serif;
      cursor: pointer;
      position: fixed;
      bottom: 20px;
      right: 400px; /* um pouco à esquerda do chat */
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .whatsapp-button:hover {
      background-color: #20ba5a;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <h1>Atendimento de Produtos – Seculus</h1>
  <h2>Atendimento de Produtos Lojista</h2>

  <!-- Botão flutuante do WhatsApp -->
  <button
    class="whatsapp-button"
    onclick="window.open('https://wa.me/5511999999999?text=Ol%C3%A1%20preciso%20de%20atendimento%20humano', '_blank')">
    💬 Falar com um atendente via WhatsApp
  </button>

  <!-- Chat do Agent Builder -->
  <df-messenger
    location="us-central1"
    project-id="mkt-produtos"
    agent-id="5c38df6c-f343-4582-8e60-790f5d75ce42"
    language-code="pt-br"
    max-query-length="-1">
    <df-messenger-chat chat-title="Atendimento de Produtos Lojista"></df-messenger-chat>
  </df-messenger>
</body>
</html>



  <!-- Fallback: também mostre um botão clicável (caso popup seja bloqueado) -->
  <!-- No seu Playbook, mantenha o payload do botão "💬 Falar com o suporte via WhatsApp" -->
</body>
</html>
