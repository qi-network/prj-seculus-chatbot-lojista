<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atendimento de Produtos – Seculus</title>

  <!-- CSS + Script do Conversational Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans"; }
    header { padding: 24px; font-size: 24px; font-weight: 700; }
    .wrap { padding: 0 24px 24px; }

    /* Deixa o chat fixo como painel lateral (opcional) */
    df-messenger {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 350px; max-width: 100%;
      z-index: 9999;

      /* Cores (ajuste se quiser) */
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-message-user-background: #d3e3fd;
      --df-messenger-message-bot-background: #fff;
    }

    /* Evita o conteúdo ficar embaixo do chat em telas largas */
    @media (min-width: 700px){
      .wrap { margin-right: 380px; }
    }
  </style>
</head>
<body>
  <header>Atendimento de Produtos – Seculus</header>
  <div class="wrap">
    <p>Use o chat à direita para falar com nosso assistente.</p>
  </div>

  <!-- Widget do Conversational Messenger -->
  <df-messenger
    location="us-central1"
    project-id="mkt-produtos"
    agent-id="5c38df6c-f343-4582-8e60-790f5d75ce42"
    language-code="pt-br"
    max-query-length="-1">
    <df-messenger-chat chat-title="Atendimento de Produtos Lojista"></df-messenger-chat>
  </df-messenger>
</body>
</html>


  <!-- Fallback: também mostre um botão clicável (caso popup seja bloqueado) -->
  <!-- No seu Playbook, mantenha o payload do botão "💬 Falar com o suporte via WhatsApp" -->
</body>
</html>
