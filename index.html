<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendimento de Produtos – Seculus</title>

  <!-- Dialogflow/Agent Builder Messenger -->
  <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
  <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

  <style>
    :root { --brand-green: #25D366; --brand-green-hover:#20ba5a; }

    body {
      margin: 0;
      font-family: "Google Sans", Arial, sans-serif;
      background-color: #fff;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 { font-size: 24px; margin-bottom: 10px; }
    h2 { font-size: 18px; margin-bottom: 20px; color: #444; }

    /* chat fixo à direita */
    df-messenger {
      z-index: 999;
      position: fixed;
      --df-messenger-font-color: #000;
      --df-messenger-font-family: Google Sans, Arial, sans-serif;
      --df-messenger-chat-background: #f3f6fc;
      --df-messenger-message-user-background: #DB4437;
      --df-messenger-message-bot-background: #fff;
      bottom: 0;
      right: 0;
      top: 0;
      width: 380px;
      border-left: 1px solid #ccc;
    }

    /* botão do WhatsApp (inicia escondido) */
    .whatsapp-button {
      display: none;                /* ← escondido por padrão */
      align-items: center;
      gap: 8px;
      background-color: var(--brand-green);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 16px;
      font-family: "Google Sans", Arial, sans-serif;
      cursor: pointer;
      position: fixed;
      bottom: 20px;
      right: 400px; /* um pouco à esquerda do chat */
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    .whatsapp-button:hover { background-color: var(--brand-green-hover); transform: scale(1.05); }

    .dot { width:8px; height:8px; background:#fff; border-radius:50%; display:inline-block; }
  </style>
</head>

<body>
  <h1>Atendimento de Produtos – Seculus</h1>
  <h2>Atendimento de Produtos Lojista</h2>

  <!-- Botão do WhatsApp (aparece só quando o agente mandar ou no fallback) -->
  <button
    id="wa-btn"
    class="whatsapp-button"
    title="Falar com um atendente via WhatsApp"
    onclick="window.open('https://wa.me/5511999999999?text=Ol%C3%A1%20preciso%20de%20atendimento%20humano', '_blank')">
    <span class="dot"></span>
    Falar com um atendente via WhatsApp
  </button>

  <!-- Chat do Agent Builder -->
  <df-messenger
    location="us-central1"
    project-id="mkt-produtos"
    agent-id="5c38df6c-f343-4582-8e60-790f5d75ce42"
    language-code="pt-br"
    max-query-length="-1">
    <df-messenger-chat chat-title="Atendimento de Produtos Lojista"></df-messenger-chat>
  </df-messenger>

  <script>
    // Elementos
    const messenger = document.querySelector('df-messenger');
    const waBtn     = document.getElementById('wa-btn');

    // Fallback: mostra o botão após N respostas do bot (caso o payload não venha)
    const FALLBACK_AFTER_BOT_REPLIES = 4;
    let botReplyCount = 0;

    // Tenta extrair mensagens tanto de CX quanto de versões diferentes do messenger
    function getResponseMessages(detail) {
      // Conversational Agents (CX) costuma expor em queryResult.responseMessages
      const r = detail?.response || {};
      const qr = r.queryResult || {};
      return qr.responseMessages || qr.fulfillmentMessages || [];
    }

    // Verifica se há um payload com show_whatsapp = true ou um marcador de texto
    function payloadWantsWhatsapp(messages) {
      for (const m of messages) {
        // CX: m.payload pode vir como objeto puro…
        if (m.payload && (m.payload.show_whatsapp === true)) return true;

        // …ou com o formato via proto (fields)
        const fields = m.payload?.fields;
        if (fields && fields.show_whatsapp && fields.show_whatsapp.boolValue === true) return true;

        // Marcador de texto opcional: [SHOW_WHATSAPP]
        const textArray = m.text?.text || m.text?.texts || [];
        if (Array.isArray(textArray) && textArray.some(t => t && t.includes('[SHOW_WHATSAPP]'))) return true;
      }
      return false;
    }

    // Evento disparado sempre que o bot envia uma resposta
    messenger.addEventListener('df-response-received', (e) => {
      const messages = getResponseMessages(e.detail);
      botReplyCount++;

      // 1) Caminho “oficial”: payload do agente
      if (payloadWantsWhatsapp(messages)) {
        waBtn.style.display = 'inline-flex';
        return;
      }

      // 2) Fallback: depois de N respostas sem resolver, ofereça WhatsApp
      if (botReplyCount >= FALLBACK_AFTER_BOT_REPLIES) {
        waBtn.style.display = 'inline-flex';
      }
    });
  </script>
</body>
</html>
